// ─── HELPERS ─────────────────────────────────────────────────────────────────
const S = arr => arr.reduce((a,b)=>a+b,0);
const fmt = n => { const k = n/1000; return Math.abs(k)>=1000?`${(k/1000).toFixed(1)}M`:Math.abs(k)>=1?`${k.toFixed(1)}`:k.toFixed(2); };
const fmtRON = n => new Intl.NumberFormat('ro-RO',{maximumFractionDigits:1}).format(Math.round(n/1000))+' KRON';
const fmtK = n => new Intl.NumberFormat('ro-RO',{maximumFractionDigits:0}).format(Math.round(n/1000));
const asPct = (v,base) => base&&base!==0?(v/base*100):0;

// Global absolute-variance cell renderer (KRON delta + % sub-label)
// Variance cell:
// - If inv=true (cost row) AND sales context (refSales+actualSales) is provided,
//   renders the pp variance of cost-as-%-of-sales (top) + the two cost ratios (bottom).
//   E.g. Cost of Sales 16.4% vs 15.6% → +0.86 pp (red because cost ratio went up)
// - Otherwise falls back to absolute KRON delta + % growth (legacy behavior).
const absVarCell = (actual, ref, inv=false, pad='7px 6px', bold=false, refSales=null, actualSales=null) => {
  if (!ref && ref !== 0) return <td style={{padding:pad,textAlign:'right',color:P.muted,fontSize:10}}>—</td>;
  if (ref === 0 && actual === 0) return <td style={{padding:pad,textAlign:'right',color:P.muted,fontSize:10}}>—</td>;
  if (inv && refSales && actualSales) {
    const aPct = actual / actualSales * 100;
    const rPct = ref / refSales * 100;
    const dPP = aPct - rPct;
    const isGood = dPP <= 0;
    const color = isGood ? P.green : P.red;
    const sign = dPP >= 0 ? '+' : '';
    return (
      <td style={{padding:pad, textAlign:'right'}}>
        <span style={{color, fontSize:bold?12:11, fontWeight:700}}>{sign}{dPP.toFixed(2)} pp</span>
        <br/>
        <span style={{color:P.muted, fontSize:8.5}}>{aPct.toFixed(1)}% vs {rPct.toFixed(1)}%</span>
      </td>
    );
  }
  const delta = actual - ref;
  const isGood = inv ? delta <= 0 : delta >= 0;
  const color = isGood ? P.green : P.red;
  const sign = delta >= 0 ? '+' : '';
  const pct = ref !== 0 ? (delta / Math.abs(ref) * 100).toFixed(1) : '—';
  return (
    <td style={{padding:pad, textAlign:'right'}}>
      <span style={{color, fontSize:bold?12:11, fontWeight:700}}>{sign}{fmtRON(delta)}</span>
      <br/>
      <span style={{color:P.muted, fontSize:8.5}}>{pct!=='—'?sign+pct+'%':'—'}</span>
    </td>
  );
};

const varPct = (actual,ref) => ref&&ref!==0?((actual-ref)/Math.abs(ref)*100):0;

const EBITDABadge = ({margin,label}) => {

  return <span style={{background:color+'22',color,padding:'2px 7px',borderRadius:20,fontSize:11,fontWeight:700,whiteSpace:'nowrap'}}>{label||''}{margin.toFixed(1)}%</span>;
};

  return <span style={{color,fontSize:11,fontWeight:600}}>{val>=0?'+':''}{val.toFixed(1)}%</span>;
};

const KPIActual = ({label,j25,j26a,j26b,fmtFn,color,sub}) => {

    if (!ref||ref===0) return null;

                      <span style={{fontSize:9.5,color:P.muted}}>({ronFmt(othTotal)} RON total · {lbl.p26a})</span>
                    </div>
                    {(
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                        <thead>
                          <tr style={{borderBottom:`1px solid ${P.border}`,background:P.bg}}>
                            <th style={{textAlign:'left',padding:'6px 14px',color:P.muted,fontWeight:600,fontSize:9.5}}>Componentă</th>
                            <th style={{textAlign:'right',padding:'6px 8px',color:P.actual,fontWeight:600,fontSize:9.5}}>{lbl.p26a} (RON)</th>
                            <th style={{textAlign:'right',padding:'6px 8px',color:P.muted,fontWeight:600,fontSize:9.5}}>% din Others</th>
                            <th style={{textAlign:'right',padding:'6px 8px',color:P.budget,fontWeight:600,fontSize:9.5}}>{lbl.p26b} (RON)</th>
                            <th style={{textAlign:'right',padding:'6px 14px',color:P.muted,fontWeight:600,fontSize:9.5}}>Δ vs Buget</th>
                          </tr>
                        </thead>
                        <tbody>
                          {othRows.map((r,i)=>{
                            const d = r.va - r.vb;         // cost: pozitiv = peste buget
                            const over = d > 0;
                            const share = othTotal ? r.va/othTotal*100 : 0;
                            return (
                              <tr key={i} style={{borderBottom:`1px solid ${P.border}22`}}>
                                <td style={{padding:'6px 14px',color:P.text}}><span style={{marginRight:6}}>{r.ic}</span>{r.k}</td>
                                <td style={{padding:'6px 8px',textAlign:'right',color:P.text,fontWeight:600}}>{ronFmt(r.va)}</td>
                                <td style={{padding:'6px 8px',textAlign:'right',color:P.muted}}>{share.toFixed(1)}%</td>
                                <td style={{padding:'6px 8px',textAlign:'right',color:P.budget}}>{ronFmt(r.vb)}</td>
                                <td style={{padding:'6px 14px',textAlign:'right',fontWeight:700,color:r.va===0&&r.vb===0?P.muted:(over?P.red:P.green)}}>
                                  {r.va===0&&r.vb===0?'—':`${over?'+':''}${ronFmt(d)}`}
                                </td>
                              </tr>
                            );
                          })}
                          <tr style={{borderTop:`2px solid ${othColor}44`,background:othColor+'0a'}}>
                            <td style={{padding:'7px 14px',color:othColor,fontWeight:800}}>Total Others</td>
                            <td style={{padding:'7px 8px',textAlign:'right',color:othColor,fontWeight:800}}>{ronFmt(othTotal)}</td>
                            <td style={{padding:'7px 8px',textAlign:'right',color:P.muted}}>100%</td>
                            <td style={{padding:'7px 8px',textAlign:'right',color:P.budget,fontWeight:700}}>{ronFmt(b.otherSGA||0)}</td>
                            <td style={{padding:'7px 14px',textAlign:'right',fontWeight:800,color:(othTotal-(b.otherSGA||0))>0?P.red:P.green}}>
                              {(othTotal-(b.otherSGA||0))>0?'+':''}{ronFmt(othTotal-(b.otherSGA||0))}
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    )}
                  </div>
                )}
              </div>
            ))}

            {/* Notă SG&A raportat la încasări */}
            {ACCT_NOTE[code] && (()=>{
              const n = ACCT_NOTE[code];
              const tc = n.tone==='green'?P.green:P.budget;
              return (
                <div style={{display:'flex',gap:11,alignItems:'flex-start',background:tc+'10',border:`1px solid ${tc}44`,borderRadius:12,padding:'12px 15px',marginTop:2}}>
                  <div style={{width:24,height:24,borderRadius:'50%',background:tc,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,flexShrink:0,marginTop:1}}>{n.tone==='green'?'✓':'▲'}</div>
                  <div>
                    <div style={{fontSize:11,fontWeight:700,color:P.text,marginBottom:3}}>{n.head}</div>
                    <div style={{fontSize:10.5,color:P.muted,lineHeight:1.5}}>{n.body}</div>
                  </div>
                </div>
              );
            })()}
          </>
        );
      })()}

    </div>
  );
};

    const p = pct(val, grv);
    return (

  const renderPctAbsCell = (val, grv, col, bold) => {
    const p = pct(val, grv);
    return (
      <td style={cellStyle(bold)}>
        <span style={{color:col, fontSize:bold?11:10, fontWeight:bold?700:400}}>{p.toFixed(2)}%</span>

        <span style={{color:P.muted, fontSize:8.5}}>{val>0?fmtK(val):'0'}</span>

  const renderVarCell = (actual, ref, inv=false) => {
    if (ref === undefined || ref === null) return <td style={{padding:'7px 6px',textAlign:'right'}}><span style={{color:P.muted,fontSize:10}}>—</span></td>;
    const delta = actual - ref;
    const isGood = inv ? delta <= 0 : delta >= 0;
    const color = isGood ? P.green : P.red;
    const sign = delta >= 0 ? '+' : '';
    const pct = ref !== 0 ? (delta / Math.abs(ref) * 100).toFixed(1) : '—';
    return (
      <td style={{padding:'6px 6px',textAlign:'right'}}>
        <span style={{color, fontSize:11, fontWeight:700}}>{sign}{fmtK(delta)}</span>
        <br/>

                  <td style={{padding:'8px 8px',color:P.teal,fontWeight:700,fontSize:12}}>HQ SG&A <span style={{color:P.muted,fontSize:10,fontWeight:400}}>(see detail below)</span></td>
                  {renderPctAbsCell(s25,g25,P.y25,false)}
                  <td style={{padding:'7px 6px',textAlign:'right',color:P.y25,fontSize:10}}>{fmtK(s25)}</td>
                  {renderPctAbsCell(s26a,g26a,P.actual,true)}
                  <td style={{padding:'7px 6px',textAlign:'right',color:P.actual,fontWeight:700,fontSize:11}}>{fmtK(s26a)}</td>
                  {renderPctAbsCell(s26b,g26b,P.budget,false)}
                  <td style={{padding:'7px 6px',textAlign:'right',color:P.budget,fontSize:10}}>{fmtK(s26b)}</td>
                  {renderVarCell(s26a,s25,true)}
                  {renderVarCell(s26a,s26b,true)}
                </tr>
              );
            })()}
            {/* Total HQ Cost */}
            {(()=>{
              const [s25,s26a,s26b] = periods.map(p=>D.totalCost[p]);
              const [g25,g26a,g26b] = periods.map(p=>D.groupRev[p]);
              return (
                <tr style={{borderTop:`2px solid ${P.accent}44`,background:P.accent+'0a'}}>
                  <td style={{padding:'10px 8px',color:P.accent,fontWeight:800,fontSize:13,fontFamily:"'Playfair Display',serif"}}>TOTAL HQ COST</td>
                  <td style={{padding:'8px 6px',textAlign:'right'}}>
                    <span style={{color:P.y25,fontWeight:700,fontSize:10}}>{pct(s25,g25).toFixed(2)}%</span><br/>
                    <span style={{color:P.muted,fontSize:8.5}}>{fmtK(s25)}</span>
                  </td>
                  <td style={{padding:'8px 6px',textAlign:'right',color:P.y25,fontWeight:700,fontSize:10}}>{fmtK(s25)}</td>
                  <td style={{padding:'8px 6px',textAlign:'right'}}>
                    <span style={{background:P.accent+'22',color:P.accent,padding:'2px 7px',borderRadius:20,fontSize:11,fontWeight:800}}>{pct(s26a,g26a).toFixed(2)}%</span>
                  </td>
                  <td style={{padding:'8px 6px',textAlign:'right',color:P.actual,fontWeight:800,fontSize:13}}>{fmtK(s26a)}</td>
                  <td style={{padding:'8px 6px',textAlign:'right'}}>
                    <span style={{color:P.budget,fontWeight:700,fontSize:10}}>{pct(s26b,g26b).toFixed(2)}%</span><br/>
                    <span style={{color:P.muted,fontSize:8.5}}>{fmtK(s26b)}</span>
                  </td>
                  <td style={{padding:'8px 6px',textAlign:'right',color:P.budget,fontWeight:700,fontSize:10}}>{fmtK(s26b)}</td>
                  {renderVarCell(s26a,s25,true)}
                  {renderVarCell(s26a,s26b,true)}
                </tr>
              );
            })()}
            {/* Net of Sales */}
            {(()=>{
              const [s25,s26a,s26b] = periods.map(p=>D.netOfSales[p]);
              const [g25,g26a,g26b] = periods.map(p=>D.groupRev[p]);
              return (
                <tr style={{borderTop:`1px dashed ${P.border}`,background:P.muted+'06'}}>
                  <td style={{padding:'8px 8px',color:P.muted,fontWeight:600,fontSize:11,fontStyle:'italic'}}>of which: Net HQ Charge to Group <span style={{fontWeight:400,fontSize:10}}>(Total Cost − HQ Sales)</span></td>
                  <td style={{padding:'7px 6px',textAlign:'right'}}>
                    <span style={{color:P.y25,fontSize:10}}>{pct(s25,g25).toFixed(2)}%</span>
                  </td>
                  <td style={{padding:'7px 6px',textAlign:'right',color:P.y25,fontSize:10}}>{fmtK(s25)}</td>
                  <td style={{padding:'7px 6px',textAlign:'right'}}>
                    <span style={{color:P.actual,fontWeight:700,fontSize:11}}>{pct(s26a,g26a).toFixed(2)}%</span>
                  </td>
                  <td style={{padding:'7px 6px',textAlign:'right',color:P.actual,fontWeight:700,fontSize:11}}>{fmtK(s26a)}</td>
                  <td style={{padding:'7px 6px',textAlign:'right'}}>
                    <span style={{color:P.budget,fontSize:10}}>{pct(s26b,g26b).toFixed(2)}%</span>
                  </td>
                  <td style={{padding:'7px 6px',textAlign:'right',color:P.budget,fontSize:10}}>{fmtK(s26b)}</td>
                  {renderVarCell(s26a,s25,true)}
                  {renderVarCell(s26a,s26b,true)}
                </tr>
              );
            })()}
          </tbody>
        </table>
      </Card>

      {/* ── SG&A Spotlight Cards: Marketing & Brand · Education & Trainings ── */}
      {(()=>{
        const spotCards = [
          { label:'Marketing & Brand',    color:'#8b6aad', icon:'📣',
            v26a: D.sga.marketing.j26a + D.sga.brandAwareness.j26a,
            v26b: D.sga.marketing.j26b + D.sga.brandAwareness.j26b,
            v25:  D.sga.marketing.j25  + D.sga.brandAwareness.j25  },
          { label:'Education & Trainings', color:'#5c8a5a', icon:'🎓',
            v26a: D.sga.education.j26a, v26b: D.sga.education.j26b, v25: D.sga.education.j25 },
          { label:'Transport & Travel', color:'#c06040', icon:'✈️',
            v26a: D.sga.transport.j26a, v26b: D.sga.transport.j26b, v25: D.sga.transport.j25 },
        ];
        return (
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>
            {spotCards.map(({label,color,icon,v26a,v26b,v25})=>{
              const gr26a=D.groupRev.j26a, gr26b=D.groupRev.j26b, gr25=D.groupRev.j25;
              const pct26a = gr26a ? v26a/gr26a*100 : 0;
              const pct26b = gr26b ? v26b/gr26b*100 : 0;
              const pct25  = gr25  ? v25/gr25*100   : 0;
              const dpBgt  = pct26a - pct26b;
              const dpPY   = pct26a - pct25;
              const bgtGood  = dpBgt  <= 0;
              const py25Good = dpPY   <= 0;
              return (
                <div key={label} style={{background:P.card,border:`1px solid ${color}33`,borderTop:`3px solid ${color}`,borderRadius:12,padding:'14px 16px',display:'flex',flexDirection:'column',gap:10}}>
                  <div style={{display:'flex',alignItems:'center',gap:7}}>
                    <span style={{fontSize:15}}>{icon}</span>
                    <span style={{fontSize:11,fontWeight:700,color,letterSpacing:'0.02em',textTransform:'uppercase'}}>{label}</span>
                    <span style={{marginLeft:'auto',fontSize:9,color:P.muted,background:P.border+'88',borderRadius:10,padding:'1px 7px'}}>SG&A sub-item</span>
                  </div>
                  <div style={{display:'flex',alignItems:'stretch',gap:10}}>
                    <div style={{flex:1,background:bgtGood?P.green+'0f':P.red+'0f',borderRadius:8,padding:'8px 10px'}}>
                      <div style={{fontSize:9,color:P.muted,marginBottom:3}}>vs Budget</div>
                      <div style={{fontSize:26,fontWeight:800,color:bgtGood?P.green:P.red,lineHeight:1,letterSpacing:'-0.5px'}}>
                        {dpBgt>0?'+':''}{dpBgt.toFixed(1)}<span style={{fontSize:12,fontWeight:700}}> pp</span>
                      </div>
                      <div style={{fontSize:9,color:P.budget,fontWeight:600,marginTop:3}}>{pct26b.toFixed(1)}% bgt</div>
                    </div>
                    <div style={{flex:1,background:py25Good?P.green+'0f':P.red+'0f',borderRadius:8,padding:'8px 10px'}}>
                      <div style={{fontSize:9,color:P.muted,marginBottom:3}}>vs {lbl.p25}</div>
                      <div style={{fontSize:20,fontWeight:700,color:py25Good?P.green:P.red,lineHeight:1,letterSpacing:'-0.3px'}}>
                        {dpPY>0?'+':''}{dpPY.toFixed(1)}<span style={{fontSize:11,fontWeight:600}}> pp</span>
                      </div>
                      <div style={{fontSize:9,color:P.y25,fontWeight:600,marginTop:3}}>{pct25.toFixed(1)}% py</div>
                    </div>
                  </div>
                  <div style={{borderTop:`1px solid ${P.border}`,paddingTop:7,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div>
                      <span style={{fontSize:10,color:P.muted}}>Actual </span>
                      <span style={{fontSize:13,fontWeight:800,color}}>{pct26a.toFixed(1)}%</span>
                      <span style={{fontSize:9.5,color:P.muted,marginLeft:4}}>{fmtK(v26a)}</span>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <span style={{fontSize:9,color:P.muted}}>gain vs bgt </span>
                      <span style={{fontSize:12,fontWeight:800,color:bgtGood?P.green:P.red}}>
                        {bgtGood?'+':''}{fmtK(-(v26a-v26b))} KRON
                      </span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* SG&A Breakdown */}
      <Card>
        <SH title={`HQ SG&A Breakdown — ${lbl.note}`} sub="Sales & Operations · Marketing · Brand Awareness — then each other line separately · % of Group Revenue · absolute KRON in parentheses"/>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead>
            <tr style={{borderBottom:`1px solid ${P.border}`}}>
              <th style={{color:P.muted,fontWeight:600,padding:'6px 8px',textAlign:'left',fontSize:11}} rowSpan={2}>SG&A Line Item</th>
              <th colSpan={2} style={{color:P.y25,textAlign:'center',padding:'5px 4px',fontSize:10,borderBottom:`2px solid ${P.y25}44`}}>{lbl.p25}</th>
              <th colSpan={2} style={{color:P.actual,textAlign:'center',padding:'5px 4px',fontSize:10,borderBottom:`2px solid ${P.actual}44`}}>{lbl.p26a}</th>
              <th colSpan={2} style={{color:P.budget,textAlign:'center',padding:'5px 4px',fontSize:10,borderBottom:`2px solid ${P.budget}44`}}>{lbl.p26b}</th>
              <th colSpan={2} style={{color:P.muted,textAlign:'center',padding:'5px 4px',fontSize:10,borderBottom:`2px solid ${P.muted}44`}}>Variance (26A)</th>
            </tr>
            <tr style={{borderBottom:`1px solid ${P.border}`}}>
              {['% Rev','KRON','% Rev','KRON','% Rev','KRON','Δ vs 25A','Δ vs Bgt'].map((h,i)=>(
                <th key={i} style={{color:P.muted,fontWeight:500,padding:'4px 5px',textAlign:'right',fontSize:9.5}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {HQ_SGA_ROWS.map((row,idx)=>{
              const [v25,v26a,v26b] = periods.map(p=>D.sga[row.key][p]);
              const [g25,g26a,g26b] = periods.map(p=>D.groupRev[p]);
              const isGroup = false;
              return (
                <tr key={row.key} style={{borderBottom:`1px solid ${P.border}22`,background:'transparent'}}>
                  <td style={{padding:'7px 8px',paddingLeft:isGroup?8:16}}>
                    <span style={{color:isGroup?P.teal:P.text,fontWeight:isGroup?600:400,fontSize:isGroup?11.5:11}}>{row.label}</span>
                    {row.sub&&<span style={{color:P.muted,fontSize:9,marginLeft:6}}>{row.sub}</span>}
                  </td>
                  {/* 25A */}
                  <td style={{padding:'6px 4px',textAlign:'right'}}>
                    <span style={{color:P.y25,fontSize:10}}>{v25>0?pct(v25,g25).toFixed(2)+'%':'—'}</span>
                  </td>
                  <td style={{padding:'6px 4px',textAlign:'right',color:P.y25,fontSize:10}}>{v25>0?fmtK(v25):'—'}</td>
                  {/* 26A */}
                  <td style={{padding:'6px 4px',textAlign:'right'}}>
                    <span style={{color:P.actual,fontSize:11,fontWeight:700}}>{v26a>0?pct(v26a,g26a).toFixed(2)+'%':'—'}</span>
                  </td>
                  <td style={{padding:'6px 4px',textAlign:'right',color:P.actual,fontWeight:600,fontSize:11}}>{v26a>0?fmtK(v26a):'—'}</td>
                  {/* 26B */}
                  <td style={{padding:'6px 4px',textAlign:'right'}}>
                    <span style={{color:P.budget,fontSize:10}}>{v26b>0?pct(v26b,g26b).toFixed(2)+'%':'—'}</span>
                  </td>
                  <td style={{padding:'6px 4px',textAlign:'right',color:P.budget,fontSize:10}}>{v26b>0?fmtK(v26b):'—'}</td>
                  {/* Variances */}
                  {renderVarCell(v26a,v25,true)}
                  {renderVarCell(v26a,v26b,true)}
                </tr>
              );
            })}
            {/* SG&A Total row */}
            {(()=>{
              const [s25,s26a,s26b] = periods.map(p=>D.sga.total[p]);
              const [g25,g26a,g26b] = periods.map(p=>D.groupRev[p]);
              return (
                <tr style={{borderTop:`2px solid ${P.teal}44`,background:P.teal+'0a'}}>
                  <td style={{padding:'9px 8px',color:P.teal,fontWeight:700,fontSize:12}}>TOTAL HQ SG&A</td>
                  <td style={{padding:'7px 4px',textAlign:'right'}}>
                    <span style={{color:P.y25,fontWeight:700,fontSize:10}}>{pct(s25,g25).toFixed(2)}%</span>
                    <br/><span style={{color:P.muted,fontSize:8.5}}>{fmtK(s25)}</span>
                  </td>
                  <td style={{padding:'7px 4px',textAlign:'right',color:P.y25,fontWeight:700,fontSize:10}}>{fmtK(s25)}</td>
                  <td style={{padding:'7px 4px',textAlign:'right'}}>
                    <span style={{background:P.teal+'22',color:P.teal,padding:'2px 7px',borderRadius:20,fontSize:11,fontWeight:800}}>{pct(s26a,g26a).toFixed(2)}%</span>
                  </td>
                  <td style={{padding:'7px 4px',textAlign:'right',color:P.actual,fontWeight:700,fontSize:12}}>{fmtK(s26a)}</td>
                  <td style={{padding:'7px 4px',textAlign:'right'}}>
                    <span style={{color:P.budget,fontWeight:700,fontSize:10}}>{pct(s26b,g26b).toFixed(2)}%</span>
                    <br/><span style={{color:P.muted,fontSize:8.5}}>{fmtK(s26b)}</span>
                  </td>
                  <td style={{padding:'7px 4px',textAlign:'right',color:P.budget,fontWeight:700,fontSize:10}}>{fmtK(s26b)}</td>
                  {renderVarCell(s26a,s25,true)}
                  {renderVarCell(s26a,s26b,true)}
                </tr>
              );
            })()}
          </tbody>
        </table>
      </Card>
    </div>
  );
};

// ─── MAIN APP ──────────────────────────────────────────────────────────────────
const TABS = [
  {id:'overview',label:'Full P&L'},
  {id:'hq',label:'HQ Cost Analysis'},
  {id:'clinics',label:'Clinics Cost Analysis'},
  {id:'cluster1',label:'① Cluster 1 – South'},
  {id:'cluster2',label:'② Cluster 2 – Central & BUC'},
  ...Object.entries(CLINICS).map(([c,v])=>({id:c,label:`${c} – ${v.name}`})),
];

function App() {
  const [tab,setTab] = useState('overview');
  const [viewMode,setViewMode] = useState('month');

  return (
    <ViewCtx.Provider value={viewMode}>
    <div style={{minHeight:'100vh',background:P.bg,fontFamily:"'DM Sans',system-ui,sans-serif",color:P.text}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:${P.bg}}
        ::-webkit-scrollbar-thumb{background:${P.border};border-radius:3px}
        table th, table td { border-color: ${P.border} !important; }
      `}</style>

      {/* Sticky top: header ribbon + tabs strip stay pinned while scrolling */}
      <div style={{position:'sticky',top:0,zIndex:100,boxShadow:'0 2px 6px rgba(0,0,0,0.06)'}}>
        {/* Header */}
        <div style={{padding:'14px 32px',borderBottom:`1px solid ${P.border}`,display:'flex',alignItems:'center',gap:18,background:'#7B1C16'}}>
          <div>
            <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:21,color:'#ffffff',letterSpacing:'-0.01em',display:'flex',alignItems:'center',gap:10}}>
              July 2026 Financial Reporting – Dr. Ardeleanu
              <span style={{background:'rgba(255,255,255,0.18)',borderRadius:6,padding:'2px 9px',fontWeight:600,letterSpacing:'0.04em',fontSize:11,fontFamily:"'DM Sans',system-ui"}}>Version 1</span>
            </h1>
          </div>
          <div style={{marginLeft:'auto',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
            {[['Jul 25 Actual',P.y25],['Jul 26 Actual',P.actual],['Jul 26 Budget',P.budget]].map(([l,col])=>(
              <div key={l} style={{display:'flex',alignItems:'center',gap:6,background:'rgba(255,255,255,0.12)',border:'1px solid rgba(255,255,255,0.2)',borderRadius:8,padding:'4px 10px'}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:col}}/>
                <span style={{color:'#fff',fontSize:11,fontWeight:600}}>{l}</span>
              </div>
            ))}
            <span style={{background:'#FBE483',color:'#7B1C16',fontSize:10,fontWeight:700,padding:'4px 10px',borderRadius:20,letterSpacing:'0.06em',textTransform:'uppercase'}}>
              Actual Jul 2026
            </span>
            {/* Month / YTD toggle */}
            <div style={{display:'flex',alignItems:'center',background:'rgba(0,0,0,0.25)',borderRadius:20,padding:3,gap:2}}>
              {['month','ytd'].map(mode=>(
                <button key={mode} onClick={()=>setViewMode(mode)} style={{
                  background: viewMode===mode ? '#ffffff' : 'transparent',
                  color: viewMode===mode ? '#7B1C16' : 'rgba(255,255,255,0.7)',
                  border:'none',cursor:'pointer',borderRadius:16,padding:'4px 13px',
                  fontSize:11,fontWeight:700,fontFamily:"'DM Sans',system-ui",
                  transition:'all 0.18s',letterSpacing:'0.04em',textTransform:'uppercase',
                }}>{mode==='month'?'Month':'YTD'}</button>
              ))}
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{padding:'0 32px',background:P.surface,borderBottom:`1px solid ${P.border}`,display:'flex',gap:2,overflowX:'auto'}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              background:'none',border:'none',cursor:'pointer',padding:'12px 14px',fontSize:12,
              fontFamily:"'DM Sans',system-ui",
              color:tab===t.id?P.accent:P.muted,
              borderBottom:`2px solid ${tab===t.id?P.accent:'transparent'}`,
              whiteSpace:'nowrap',transition:'all 0.15s',fontWeight:tab===t.id?600:400,
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{padding:'20px 32px',maxWidth:1440,margin:'0 auto'}}>
        {tab==='overview' && <FullPL/>}
        {tab==='hq' && <HQCostAnalysis/>}
        {tab==='clinics' && <ClinicsOverview/>}
        {tab==='cluster1' && <ClusterTab clusterId="cluster1"/>}
        {tab==='cluster2' && <ClusterTab clusterId="cluster2"/>}
        {CLINICS[tab] && <ClinicPL code={tab}/>}
      </div>
    </div>
    </ViewCtx.Provider>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

<script>
  // Manually transform the JSX source with Babel, forcing the "classic" runtime
  // (React.createElement calls) instead of the default "automatic" runtime, which
  // injects an `import ... from "react/jsx-runtime"` statement — that's ES module
  // syntax and throws "Cannot use import statement outside a module" in a plain
  // <script>. Classic runtime avoids the import entirely.
  const __jsxSource = document.getElementById('app-jsx-source').textContent;
  const __compiled = Babel.transform(__jsxSource, {
    presets: [['react', { runtime: 'classic' }]],
  }).code;
  const __appScript = document.createElement('script');
  __appScript.textContent = __compiled;
  document.body.appendChild(__appScript);
</script>

<script>
  // hide the loading message once React has mounted something into #root
  const check = setInterval(() => {
    if (document.getElementById('root').children.length > 0) {
      document.getElementById('loading').remove();
      clearInterval(check);
    }
  }, 150);
</script>
